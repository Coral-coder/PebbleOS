name: Cleanup artifacts

# Deletes old workflow artifacts to keep Actions storage inside the free
# 0.5 GB-month allowance. Runs weekly as a safety net behind the per-workflow
# retention-days caps, and can be dispatched manually to purge immediately
# (e.g. to clear out artifacts uploaded before the caps existed, which carry
# the 90-day default retention).

on:
  workflow_dispatch:
    inputs:
      keep_hours:
        description: 'Delete artifacts older than this many hours'
        default: '24'
  schedule:
    - cron: '43 5 * * 1'   # weekly, Monday 05:43 UTC

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_HOURS: ${{ inputs.keep_hours || '168' }}
        run: |
          cutoff=$(date -u -d "-${KEEP_HOURS} hours" +%s)
          # Collect IDs first, then delete, so pagination doesn't shift
          # underneath the loop.
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --paginate \
                --jq ".artifacts[] | select((.created_at | fromdateiso8601) < ${cutoff}) | .id")
          count=$(printf '%s\n' "$ids" | grep -c . || true)
          echo "Deleting ${count} artifacts older than ${KEEP_HOURS} hours..."
          printf '%s\n' "$ids" | xargs -r -P 8 -I {} sh -c \
            'gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}" >/dev/null \
               && echo "deleted {}" || echo "FAILED {}"'
          echo "Done: processed ${count} artifacts."
