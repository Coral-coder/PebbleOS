name: Sync upstream

# Polls coredevices/PebbleOS and keeps `main` up to date.
#
# Design goals (vs. the old version):
#  - main advances automatically whenever the merge is clean OR rerere already
#    knows how to resolve the conflicts (so recurring nightly conflicts stop
#    needing hand resolution).
#  - a genuinely-new conflict never blocks the pipeline and never commits
#    conflict markers: main is left untouched and ONE standing PR surfaces it.
#  - runs often and exits instantly when there is nothing new, so a 15-minute
#    cadence is cheap. True "on every upstream push" is impossible without
#    controlling the upstream repo; frequent polling is the practical stand-in.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (best-effort; GitHub delays these)
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false      # never interrupt an in-flight sync

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git + rerere
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Reuse recorded resolutions: resolve a conflict once, it auto-applies
          # forever after. autoupdate stages the reused resolution for us.
          git config rerere.enabled true
          git config rerere.autoupdate true

      # Persist the rerere cache across runs. Without this the "resolve once"
      # memory is thrown away every run (.git is ephemeral in CI).
      - name: Restore rerere cache
        uses: actions/cache@v4
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}
          restore-keys: |
            rerere-

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/coredevices/PebbleOS.git 2>/dev/null || true
          git fetch upstream main --tags --force

      - name: Skip if already up to date
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already contains upstream/main — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record existing version tags
        if: steps.check.outputs.changed == 'true'
        run: |
          git tag -l 'v*' | sort -V > /tmp/tags_before.txt || true

      - name: Merge upstream/main (rerere-assisted)
        if: steps.check.outputs.changed == 'true'
        id: merge
        run: |
          set +e
          git merge --no-ff --no-edit upstream/main
          # Anything still unmerged is a conflict rerere has never seen.
          if [ -n "$(git ls-files -u)" ]; then
            echo "::group::Novel conflicts (need a human once)"
            git ls-files -u | awk '{print $4}' | sort -u
            echo "::endgroup::"
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No unmerged paths. If the merge stopped for us (clean-but-uncommitted,
          # or fully rerere-resolved), finish it — but refuse to record markers.
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git add -A
            if ! git diff --cached --check; then
              echo "Conflict markers present after auto-resolve — bailing out."
              git merge --abort
              echo "clean=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --no-edit
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"

      - name: Push main
        if: steps.merge.outputs.clean == 'true'
        run: git push origin HEAD:main

      # Preserve the original behaviour: forward the newest upstream release tag
      # so the release workflow builds it.
      - name: Push newest new release tag
        if: steps.merge.outputs.clean == 'true'
        run: |
          new_tag="$(comm -13 /tmp/tags_before.txt <(git tag -l 'v*' | sort -V) | tail -1)"
          if [ -n "$new_tag" ]; then
            echo "Pushing release tag $new_tag"
            git push origin "refs/tags/${new_tag}"
          else
            echo "No new upstream release tags."
          fi

      # Novel conflict path: DO NOT touch main, DO NOT commit markers.
      # Point one standing branch at upstream/main and let GitHub's own UI show
      # the conflicts. A human resolves once; rerere remembers; next run
      # auto-advances main. Reusing a single branch/PR avoids the dated-PR pileup.
      - name: Surface novel conflicts as a single standing PR
        if: steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="automation/upstream-sync"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null)"
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $BRANCH — leaving the in-progress branch alone."
            exit 0
          fi
          # No open PR: (re)create the branch at upstream/main and open one.
          git push --force origin upstream/main:refs/heads/$BRANCH
          gh pr create --base main --head "$BRANCH" \
            --title "sync: upstream — needs one-time conflict resolution" \
            --body "Automated upstream sync hit a conflict rerere has not seen yet.
          Resolve it here (or locally with rerere enabled). Once resolved and merged,
          rerere records the resolution and future syncs auto-advance \`main\`.
          main has NOT been modified and contains no conflict markers.

          Upstream: https://github.com/coredevices/PebbleOS"
